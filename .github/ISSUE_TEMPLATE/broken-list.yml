name: A list broke something
description: Something stopped working after applying a list from this library.
title: "[Broken] <model>: <what broke>"
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **First, undo it:** `python3 -I tools/tvlib.py restore --last-batch` (or `--all`), then reboot.
        Black screen? See "Recovery" in CLAUDE.md.
  - type: input
    id: list
    attributes:
      label: Which list did you apply?
      placeholder: models/android-tv/tcl-xxx/debloat.txt  (or brands/tcl/consensus.txt)
    validations:
      required: true
  - type: textarea
    id: props
    attributes:
      label: Your TV
      description: Model on the sticker, plus `adb shell getprop ro.product.model` and `ro.build.version.incremental`
      render: text
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What broke, and which package fixed it when re-enabled (if you found it)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: state/<your tv>/log.jsonl (optional)
      description: Contains package names and timestamps only. Remove anything you don't want public.
      render: text
